[project]
name = "agentmaxxing"
version = "0.1.0"
description = "Signed, tamper-evident receipts for agent tool calls, plus a study of how often agents misreport them."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["cryptography>=43"]

[project.scripts]
agentmaxxing = "agentmaxxing.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmaxxing"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
